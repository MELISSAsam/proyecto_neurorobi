name: neurorobi
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neurorobi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neurorobi"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: neurorobi-backend:local
    build: ./backend_NeuroRobi-main/neurorobi_backend
    command: ["sh", "-c", "node scripts/migrate.cjs && node scripts/bootstrap-admin.cjs"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/neurorobi?schema=public
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      MULTI_USER_ENABLED: ${MULTI_USER_ENABLED:-true}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  backend:
    image: neurorobi-backend:local
    build: ./backend_NeuroRobi-main/neurorobi_backend
    init: true
    command: ["npm", "run", "start:prod", "--", "--kill-others"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/neurorobi?schema=public
      JWT_SECRET: ${JWT_SECRET:?Completa JWT_SECRET en .env}
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:?Completa TELEMETRY_API_KEY en .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost,http://127.0.0.1}
      UPLOADS_DIR: /app/uploads
      SEED_DEMO_DATA: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
  web:
    build: ./fronted_NeuroRobi-main/neurorobi_fronted
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres:
  uploads:
  caddy_data:
  caddy_config:
